<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay OBS — Marcador en Vivo</title>
  <style>
    /* Fondo transparente para OBS Browser Source */
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    #overlay-root {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 16px;
      pointer-events: none;
    }

    /* ===== MARCADOR PRINCIPAL ===== */
    #marcador {
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(10, 10, 10, 0.82);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      min-width: 380px;
      transition: opacity 0.3s;
    }
    #marcador.oculto { opacity: 0; }

    .equipo-bloque {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      min-width: 120px;
    }
    .equipo-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-bottom: 4px;
    }
    .equipo-logo-placeholder {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      margin-bottom: 4px;
    }
    .equipo-nombre {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 110px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .marcador-centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 20px;
      border-left: 1px solid rgba(255,255,255,0.1);
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .marcador-goles {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .gol {
      color: #fff;
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      min-width: 32px;
      text-align: center;
    }
    .marcador-separador {
      color: rgba(255,255,255,0.5);
      font-size: 28px;
      font-weight: 300;
    }
    .marcador-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .periodo-badge {
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .minuto {
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      font-weight: 600;
    }
    .minuto.oculto { display: none; }

    /* ===== TEXTO EVENTO ===== */
    #texto-evento {
      margin-top: 12px;
      background: rgba(220, 38, 38, 0.88);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 6px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 500px;
      animation: slideIn 0.3s ease;
      transition: opacity 0.3s;
    }
    #texto-evento.oculto { opacity: 0; pointer-events: none; }

    @keyframes slideIn {
      from { transform: translateY(-8px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ===== INDICADOR CONEXIÓN ===== */
    #conn-dot {
      position: fixed;
      bottom: 10px;
      right: 12px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
      transition: background 0.3s;
    }
    #conn-dot.conectado  { background: #22c55e; }
    #conn-dot.error      { background: #ef4444; }

    /* ===== PUBLICIDAD (auspiciantes del campeonato) =====
       Medidas en vh/vw: funciona con lienzo de OBS 1920×1080 o 1280×720. */
    #overlay-root.oculto { opacity: 0; }
    #overlay-root { transition: opacity 0.4s; }

    #publicidad-esquina {
      position: fixed;
      right: 2.2vw;
      bottom: 3.5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6vh;
      min-width: 12vw;
      max-width: 20vw;
      padding: 1.1vh 1.2vw;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 1vh;
      box-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.45);
      transition: opacity 0.5s;
      pointer-events: none;
    }
    #publicidad-esquina.oculto { opacity: 0; }
    .pub-etiqueta {
      font-size: 1.3vh;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #64748b;
    }
    #pub-esquina-logo {
      max-width: 17vw;
      max-height: 9vh;
      object-fit: contain;
    }
    /* Anuncios en video (16:9 o vertical tipo reel) */
    .pub-media-wrap { display: flex; align-items: center; justify-content: center; }
    #publicidad-esquina.es-video {
      padding: 0.6vh;
      background: rgba(10, 10, 10, 0.85);
      max-width: 26vw;
    }
    #publicidad-esquina.es-video .pub-etiqueta { color: #e2e8f0; }
    #publicidad-esquina video {
      display: block;
      max-width: 25vw;
      max-height: 26vh;
      border-radius: 0.8vh;
      object-fit: contain;
      background: #000;
    }
    #pub-esquina-nombre {
      font-size: 1.9vh;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
    }

    #pantalla-entretiempo {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      background: radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.94), rgba(2, 6, 23, 0.97));
      color: #fff;
      transition: opacity 0.6s;
      pointer-events: none;
    }
    #pantalla-entretiempo.oculto { opacity: 0; }
    .et-titulo {
      font-size: 6.5vh;
      font-weight: 900;
      letter-spacing: 0.2em;
    }
    .et-marcador {
      display: flex;
      align-items: center;
      gap: 2.5vw;
      font-size: 3.6vh;
      font-weight: 700;
      text-transform: uppercase;
    }
    #et-goles {
      font-size: 6vh;
      font-weight: 900;
      padding: 0.5vh 1.6vw;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1vh;
    }
    .et-pub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5vh;
      transition: opacity 0.5s;
    }
    .et-pub.oculto { opacity: 0; }
    .et-pub-etiqueta {
      font-size: 2vh;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #cbd5e1;
    }
    .et-pub-tarjeta {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 30vw;
      min-height: 22vh;
      padding: 3vh 3vw;
      background: #fff;
      border-radius: 2vh;
    }
    #et-pub-logo {
      max-width: 52vw;
      max-height: 32vh;
      object-fit: contain;
    }
    .et-pub-tarjeta.es-video {
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    .et-pub-tarjeta video {
      display: block;
      max-width: 64vw;
      max-height: 52vh;
      object-fit: contain;
    }
    #et-pub-nombre {
      font-size: 3.4vh;
      font-weight: 800;
    }
  </style>
</head>
<body>

<div id="overlay-root">
  <div id="marcador">
    <!-- Equipo Local -->
    <div class="equipo-bloque" id="bloque-local">
      <div class="equipo-logo-placeholder" id="logo-local-wrap"></div>
      <span class="equipo-nombre" id="nombre-local">LOCAL</span>
    </div>

    <!-- Centro -->
    <div class="marcador-centro">
      <div class="marcador-goles">
        <span class="gol" id="gol-local">0</span>
        <span class="marcador-separador">–</span>
        <span class="gol" id="gol-visitante">0</span>
      </div>
      <div class="marcador-info">
        <span class="periodo-badge" id="periodo-badge">1T</span>
        <span class="minuto" id="minuto-display">0'</span>
      </div>
    </div>

    <!-- Equipo Visitante -->
    <div class="equipo-bloque" id="bloque-visitante">
      <div class="equipo-logo-placeholder" id="logo-visitante-wrap"></div>
      <span class="equipo-nombre" id="nombre-visitante">VISITANTE</span>
    </div>
  </div>

  <div id="texto-evento" class="oculto">GOL!</div>
</div>

<!-- Publicidad durante el juego: un auspiciante a la vez, rotando. -->
<div id="publicidad-esquina" class="oculto">
  <span class="pub-etiqueta" id="pub-esquina-etiqueta">Auspicia</span>
  <div class="pub-media-wrap" id="pub-esquina-media"></div>
  <div id="pub-esquina-nombre"></div>
</div>

<!-- Entretiempo: pantalla completa con marcador y auspiciantes. -->
<div id="pantalla-entretiempo" class="oculto">
  <div class="et-titulo">ENTRETIEMPO</div>
  <div class="et-marcador">
    <span id="et-local">LOCAL</span>
    <span id="et-goles">0 – 0</span>
    <span id="et-visitante">VISITANTE</span>
  </div>
  <div class="et-pub oculto" id="et-pub">
    <div class="et-pub-etiqueta" id="et-pub-etiqueta">Gracias a nuestros auspiciantes</div>
    <div class="et-pub-tarjeta" id="et-pub-media"></div>
    <div id="et-pub-nombre"></div>
  </div>
</div>

<div id="conn-dot" title="Conexión Socket.io"></div>

<!-- Socket.io client -->
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<script>
  // ── Leer overlay_token desde la URL: /overlay.html?token=xxx
  const params = new URLSearchParams(location.search);
  const overlayToken = params.get("token");

  // Backend: en producción vive en otro dominio. Misma regla que
  // resolveApiBaseUrl() en core.js (esta página pública no carga core.js;
  // overlay.html se abre en OBS como Browser Source).
  const API_BASE = (() => {
    const host = location.hostname;
    if (location.protocol === "file:" || (/^(localhost|127\.0\.0\.1)$/i.test(host) && location.port && location.port !== "5000")) {
      return "http://localhost:5000";
    }
    const PROD_HOST_BACKEND_MAP = { "ltyc.corpsimtelec.com": "https://api.ltyc.corpsimtelec.com" };
    return PROD_HOST_BACKEND_MAP[host] || location.origin;
  })();

  const elGolLocal      = document.getElementById("gol-local");
  const elGolVisitante  = document.getElementById("gol-visitante");
  const elPeriodo       = document.getElementById("periodo-badge");
  const elMinuto        = document.getElementById("minuto-display");
  const elMarcador      = document.getElementById("marcador");
  const elTextoEvento   = document.getElementById("texto-evento");
  const elNombreLocal   = document.getElementById("nombre-local");
  const elNombreVisit   = document.getElementById("nombre-visitante");
  const elLogoLocalWrap = document.getElementById("logo-local-wrap");
  const elLogoVisitWrap = document.getElementById("logo-visitante-wrap");
  const connDot         = document.getElementById("conn-dot");

  let transmisionId = null;

  // ── Publicidad: anuncios (imagen/video) + auspiciantes ───────────
  // Dos reproductores: esquina (durante el juego) y entretiempo (pantalla
  // completa). Imágenes: los segundos indicados. Videos: hasta terminar,
  // con tope en sus segundos. Un solo video en la lista se repite.
  const elRoot          = document.getElementById("overlay-root");
  const elPubEsquina    = document.getElementById("publicidad-esquina");
  const elEntretiempo   = document.getElementById("pantalla-entretiempo");
  const elEtPub         = document.getElementById("et-pub");
  let auspiciantes = [];
  let anuncios = [];
  let segundosPub = 8;
  let ultimoState = {};

  function urlMedia(url) {
    if (!url) return "";
    return /^https?:\/\//i.test(url) ? url : API_BASE + "/" + String(url).replace(/^\//, "");
  }

  function crearReproductor({ caja, media, etiqueta, nombre, claseVideo, textoAuspicio, textoPublicidad }) {
    return { caja, media, etiqueta, nombre, claseVideo, textoAuspicio, textoPublicidad, lista: [], idx: 0, timer: null, activo: false, firma: "" };
  }

  const repEsquina = crearReproductor({
    caja: elPubEsquina,
    media: document.getElementById("pub-esquina-media"),
    etiqueta: document.getElementById("pub-esquina-etiqueta"),
    nombre: document.getElementById("pub-esquina-nombre"),
    claseVideo: elPubEsquina,
    textoAuspicio: "Auspicia",
    textoPublicidad: "Publicidad",
  });
  const repEntretiempo = crearReproductor({
    caja: elEtPub,
    media: document.getElementById("et-pub-media"),
    etiqueta: document.getElementById("et-pub-etiqueta"),
    nombre: document.getElementById("et-pub-nombre"),
    claseVideo: document.getElementById("et-pub-media"),
    textoAuspicio: "Gracias a nuestros auspiciantes",
    textoPublicidad: "Publicidad",
  });

  function construirListas() {
    const incluirAusp = ultimoState.incluir_auspiciantes !== false;
    const desdeAusp = incluirAusp
      ? auspiciantes.map((a) => ({ tipo: a.logo_url ? "imagen" : "nombre", url: a.logo_url, nombre: a.nombre, ubicacion: "ambos", duracion_segundos: segundosPub, esAuspiciante: true }))
      : [];
    const desdeAnuncios = anuncios.map((a) => ({ tipo: a.tipo, url: a.url, nombre: a.anunciante, ubicacion: a.ubicacion, duracion_segundos: a.duracion_segundos, con_sonido: a.con_sonido === true, esAuspiciante: false }));
    const todos = [...desdeAnuncios, ...desdeAusp];
    return {
      esquina: todos.filter((x) => x.ubicacion === "esquina" || x.ubicacion === "ambos"),
      entretiempo: todos.filter((x) => x.ubicacion === "entretiempo" || x.ubicacion === "ambos"),
    };
  }

  function detener(rep) {
    clearTimeout(rep.timer);
    rep.timer = null;
    const v = rep.media.querySelector("video");
    if (v) { try { v.pause(); } catch (_) {} v.removeAttribute("src"); v.load?.(); }
    rep.media.innerHTML = "";
  }

  function siguiente(rep) {
    if (!rep.lista.length) return;
    rep.idx = (rep.idx + 1) % rep.lista.length;
    reproducir(rep);
  }

  function reproducir(rep) {
    detener(rep);
    if (!rep.activo || !rep.lista.length) return;
    const item = rep.lista[rep.idx % rep.lista.length];
    rep.etiqueta.textContent = item.esAuspiciante ? rep.textoAuspicio : rep.textoPublicidad;
    rep.claseVideo.classList.toggle("es-video", item.tipo === "video");
    const segundos = Math.max(3, Number(item.esAuspiciante ? segundosPub : item.duracion_segundos) || 8);
    const unico = rep.lista.length === 1;

    if (item.tipo === "video") {
      rep.nombre.textContent = "";
      const v = document.createElement("video");
      v.src = urlMedia(item.url);
      v.playsInline = true;
      v.autoplay = true;
      v.muted = !item.con_sonido;
      v.loop = unico;
      v.preload = "auto";
      v.addEventListener("ended", () => siguiente(rep));
      v.addEventListener("error", () => { if (!unico) siguiente(rep); });
      rep.media.appendChild(v);
      // Los navegadores comunes bloquean el sonido automático; OBS no. Si se
      // bloquea, se reproduce sin sonido.
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      if (!unico) rep.timer = setTimeout(() => siguiente(rep), segundos * 1000);
      return;
    }

    if (item.tipo === "imagen" && item.url) {
      const img = document.createElement("img");
      img.src = urlMedia(item.url);
      img.alt = "";
      if (rep === repEsquina) img.id = "pub-esquina-logo"; else img.id = "et-pub-logo";
      rep.media.appendChild(img);
      rep.nombre.textContent = "";
    } else {
      rep.nombre.textContent = item.nombre || "";
    }
    if (!unico) rep.timer = setTimeout(() => siguiente(rep), segundos * 1000);
  }

  // Activa o detiene cada reproductor según el estado; si la lista cambió,
  // vuelve a empezar.
  function actualizarReproductor(rep, lista, activo) {
    const firma = JSON.stringify(lista.map((x) => [x.tipo, x.url, x.nombre, x.duracion_segundos, x.con_sonido]));
    const cambioLista = firma !== rep.firma;
    rep.firma = firma;
    rep.lista = lista;
    if (cambioLista && rep.idx >= lista.length) rep.idx = 0;
    if (!activo || !lista.length) {
      if (rep.activo) detener(rep);
      rep.activo = false;
      return;
    }
    if (!rep.activo || cambioLista) {
      rep.activo = true;
      reproducir(rep);
    }
  }

  function aplicarPublicidad(state) {
    const entretiempo = state.pantalla_entretiempo === true;
    const nuevosSegundos = Math.max(3, Number(state.publicidad_segundos) || 8);
    const cambioSegundos = nuevosSegundos !== segundosPub;
    segundosPub = nuevosSegundos;
    const listas = construirListas();
    if (cambioSegundos) { repEsquina.firma = ""; repEntretiempo.firma = ""; }

    elEntretiempo.classList.toggle("oculto", !entretiempo);
    elRoot.classList.toggle("oculto", entretiempo);
    const esquinaVisible = !entretiempo && listas.esquina.length > 0 && state.mostrar_publicidad !== false;
    elPubEsquina.classList.toggle("oculto", !esquinaVisible);
    elEtPub.classList.toggle("oculto", !listas.entretiempo.length);
    actualizarReproductor(repEsquina, listas.esquina, esquinaVisible);
    actualizarReproductor(repEntretiempo, listas.entretiempo, entretiempo);
    document.getElementById("et-goles").textContent =
      `${state.goles_local ?? 0} – ${state.goles_visitante ?? 0}`;
  }

  function guardarPublicidad(data) {
    auspiciantes = Array.isArray(data.auspiciantes) ? data.auspiciantes : [];
    anuncios = Array.isArray(data.anuncios) ? data.anuncios : [];
  }

  async function cargarAuspiciantes() {
    try {
      const res = await fetch(`${API_BASE}/api/public/overlay/${overlayToken}`);
      if (!res.ok) return;
      guardarPublicidad(await res.json());
      aplicarPublicidad(ultimoState);
    } catch (_) {}
  }

  function aplicarState(state) {
    ultimoState = { ...ultimoState, ...state };
    aplicarPublicidad(ultimoState);
    elGolLocal.textContent     = state.goles_local ?? 0;
    elGolVisitante.textContent = state.goles_visitante ?? 0;
    elPeriodo.textContent      = state.periodo ?? "1T";
    elMinuto.textContent       = (state.minuto ?? 0) + "'";

    elMarcador.classList.toggle("oculto", !state.mostrar_marcador);
    elMinuto.classList.toggle("oculto", !state.mostrar_cronometro);

    const textoVisible = state.mostrar_texto_evento && state.texto_evento;
    elTextoEvento.classList.toggle("oculto", !textoVisible);
    if (textoVisible) elTextoEvento.textContent = state.texto_evento;
  }

  function setLogo(wrapper, logoUrl) {
    wrapper.innerHTML = "";
    if (logoUrl) {
      const img = document.createElement("img");
      img.className = "equipo-logo";
      img.src = logoUrl.startsWith("http") ? logoUrl : (API_BASE + "/" + logoUrl.replace(/^\//, ""));
      img.onerror = () => { wrapper.innerHTML = '<div class="equipo-logo-placeholder"></div>'; };
      wrapper.appendChild(img);
    } else {
      wrapper.innerHTML = '<div class="equipo-logo-placeholder"></div>';
    }
  }

  async function cargarEstadoInicial() {
    if (!overlayToken) {
      console.warn("overlay.html: falta ?token=xxx en la URL");
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/public/overlay/${overlayToken}`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      transmisionId = data.transmision_id;
      elNombreLocal.textContent  = data.equipo_local?.nombre  || "LOCAL";
      elNombreVisit.textContent  = data.equipo_visitante?.nombre || "VISITANTE";
      setLogo(elLogoLocalWrap, data.equipo_local?.logo_url);
      setLogo(elLogoVisitWrap, data.equipo_visitante?.logo_url);
      document.getElementById("et-local").textContent = elNombreLocal.textContent;
      document.getElementById("et-visitante").textContent = elNombreVisit.textContent;

      guardarPublicidad(data);
      if (data.overlay) aplicarState(data.overlay);
      else aplicarPublicidad(ultimoState);
      // Respaldo: además del aviso por socket, se recarga cada 5 min.
      setInterval(cargarAuspiciantes, 5 * 60 * 1000);

      // Conectar Socket.io y unirse a la sala
      conectarSocket();
    } catch (err) {
      console.error("Error cargando overlay inicial:", err);
      connDot.className = "error";
    }
  }

  function conectarSocket() {
    const socket = io(API_BASE, { transports: ["websocket", "polling"] });

    socket.on("connect", () => {
      connDot.className = "conectado";
      socket.emit("join:overlay", { transmision_id: transmisionId });
    });

    socket.on("disconnect", () => {
      connDot.className = "";
    });

    socket.on("overlay:state", (state) => {
      aplicarState(state);
    });

    // Cambiaron los anuncios del campeonato: recargar la publicidad.
    socket.on("overlay:publicidad", () => cargarAuspiciantes());

    socket.on("connect_error", () => {
      connDot.className = "error";
    });
  }

  cargarEstadoInicial();
</script>
</body>
</html>
